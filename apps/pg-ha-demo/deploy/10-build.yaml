# O build roda DENTRO do cluster: clona apps/pg-ha-demo/src do Git, roda o S2I do Node.js 20
# (UBI9) e gera a imagem s390x no registry interno — mesmo caminho do app `estoque`.
# Código novo: commit + push, depois `oc start-build pg-ha-demo -n demos` e
# `oc rollout restart deploy/pg-ha-demo -n demos`.
apiVersion: image.openshift.io/v1
kind: ImageStream
metadata:
  name: pg-ha-demo
  labels: {app.kubernetes.io/part-of: pg-ha-demo}
---
apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: pg-ha-demo
  labels: {app.kubernetes.io/part-of: pg-ha-demo}
spec:
  runPolicy: Serial
  source:
    type: Git
    git:
      uri: https://github.com/Marcosgois/gitops-lab.git
      ref: main
    contextDir: apps/pg-ha-demo/src
  strategy:
    type: Source
    sourceStrategy:
      from:
        kind: ImageStreamTag
        namespace: openshift
        name: nodejs:20-ubi9
  output:
    to:
      kind: ImageStreamTag
      name: pg-ha-demo:latest
  triggers:
  - type: ConfigChange
